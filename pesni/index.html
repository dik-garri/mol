<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Песни – Молодёжка</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="dark">

  <!-- LIST VIEW -->
  <main id="list-view" class="view">
    <header class="list-header">
      <a class="back-link" href="../"><i class="fa-solid fa-arrow-left"></i> Главная</a>
      <h1>Песни</h1>
      <button id="theme-toggle-list" class="icon-btn" title="Сменить тему">
        <i class="fa-solid fa-moon"></i>
      </button>
    </header>

    <div class="search-bar">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input id="search" type="search" placeholder="Поиск по номеру, названию или тексту..." autocomplete="off">
      <span id="search-count" class="search-count"></span>
    </div>

    <ul id="songs-list" class="songs-list"></ul>
  </main>

  <!-- SONG VIEW -->
  <main id="song-view" class="view hidden">
    <header class="song-header">
      <button class="icon-btn" data-action="back" title="К списку">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <div class="song-meta">
        <span id="song-number" class="song-number"></span>
        <h2 id="song-title"></h2>
        <span id="song-key" class="song-key"></span>
      </div>
      <button id="chords-toggle" class="icon-btn" title="Показать/скрыть аккорды">
        <i class="fa-solid fa-music"></i>
      </button>
      <button id="theme-toggle-song" class="icon-btn" title="Сменить тему">
        <i class="fa-solid fa-moon"></i>
      </button>
    </header>

    <section class="song-stage" id="song-stage">
      <div id="block-label" class="block-label"></div>
      <div id="block-content" class="block-content"></div>
    </section>

    <footer class="song-nav">
      <button id="prev-block" class="nav-btn" title="Предыдущий блок (←)">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <span id="block-counter" class="block-counter"></span>
      <button id="next-block" class="nav-btn" title="Следующий блок (→)">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </footer>
  </main>

  <script src="data/songs.js"></script>
  <script src="app.js"></script>
</body>
</html>
