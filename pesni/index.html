<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Песни – Молодёжка</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="dark">

  <!-- LIST VIEW -->
  <main id="list-view" class="view">
    <header class="list-header">
      <a class="back-link" href="../"><i class="fa-solid fa-arrow-left"></i> Главная</a>
      <h1>Песни</h1>
      <button class="icon-btn projector-indicator hidden" data-action="close-projector" title="Проектор открыт — клик, чтобы закрыть">
        <i class="fa-solid fa-tv"></i>
      </button>
      <button id="settings-toggle" class="icon-btn" title="Настройки стиля">
        <i class="fa-solid fa-gear"></i>
      </button>
    </header>

    <div class="search-bar">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input id="search" type="search" placeholder="Поиск по номеру, названию или тексту..." autocomplete="off">
      <span id="search-count" class="search-count"></span>
    </div>

    <ul id="songs-list" class="songs-list"></ul>
  </main>

  <!-- SONG VIEW -->
  <main id="song-view" class="view hidden">
    <header class="song-header">
      <button class="icon-btn" data-action="back" title="К списку">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <div class="song-meta">
        <span id="song-number" class="song-number"></span>
        <h2 id="song-title"></h2>
        <span id="song-key" class="song-key"></span>
      </div>
      <div class="song-nav">
        <button id="prev-block" class="icon-btn" title="Предыдущий блок (←)">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <span id="block-counter" class="block-counter"></span>
        <span id="next-block-hint" class="next-block-hint hidden"></span>
        <button id="next-block" class="icon-btn" title="Следующий блок (→)">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>
      <button class="icon-btn projector-indicator hidden" data-action="close-projector" title="Проектор открыт — клик, чтобы закрыть">
        <i class="fa-solid fa-tv"></i>
      </button>
      <button id="settings-toggle-song" class="icon-btn" data-action="open-settings" title="Настройки стиля">
        <i class="fa-solid fa-gear"></i>
      </button>
      <button id="font-decrease" class="icon-btn" title="Уменьшить шрифт">
        <i class="fa-solid fa-minus"></i>
      </button>
      <button id="font-increase" class="icon-btn" title="Увеличить шрифт">
        <i class="fa-solid fa-plus"></i>
      </button>
      <button id="chords-toggle" class="icon-btn" title="Показать/скрыть аккорды">
        <i class="fa-solid fa-music"></i>
      </button>
    </header>

    <div class="presenter-body">
      <aside class="presenter-aside presenter-songs">
        <div class="aside-header">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input id="presenter-search" type="search" placeholder="Поиск..." autocomplete="off">
        </div>
        <ul id="presenter-songs-list" class="songs-list compact"></ul>
      </aside>

      <section class="song-stage" id="song-stage">
        <div id="block-label" class="block-label"></div>
        <div id="block-content" class="block-content"></div>
      </section>

      <aside class="presenter-aside presenter-blocks">
        <div class="aside-header">
          <span class="aside-label">Блоки</span>
        </div>
        <ol id="presenter-blocks-list" class="blocks-list"></ol>
      </aside>
    </div>
  </main>

  <!-- SETTINGS MODAL -->
  <div id="settings-modal" class="modal hidden" role="dialog" aria-labelledby="settings-title" aria-hidden="true">
    <div class="modal-backdrop" data-action="close-settings"></div>
    <div class="modal-content">
      <header class="modal-header">
        <h3 id="settings-title">Стиль</h3>
        <button class="icon-btn" data-action="close-settings" title="Закрыть">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </header>

      <section class="modal-section">
        <div class="section-label">Пресет</div>
        <div id="preset-grid" class="preset-grid"></div>
      </section>

      <section class="modal-section">
        <div class="section-label">Тонкая подстройка</div>
        <label class="setting-row">
          <span>Шрифт</span>
          <select id="setting-font">
            <option value="Montserrat">Montserrat</option>
            <option value="Lora">Lora</option>
            <option value="Inter">Inter</option>
            <option value="Playfair Display">Playfair Display</option>
            <option value="Menlo">Menlo (моно)</option>
          </select>
        </label>
        <label class="setting-row">
          <span>Фон</span>
          <input type="color" id="setting-bg">
        </label>
        <label class="setting-row">
          <span>Текст</span>
          <input type="color" id="setting-text">
        </label>
        <label class="setting-row">
          <span>Акцент</span>
          <input type="color" id="setting-accent">
        </label>
        <label class="setting-row">
          <span>Аккорды</span>
          <input type="color" id="setting-chord">
        </label>
      </section>

      <section class="modal-section">
        <div class="section-label">Проектор</div>
        <button id="open-projector" class="text-btn text-btn-primary" type="button">
          <i class="fa-solid fa-tv"></i> Открыть окно проектора
        </button>
        <p class="setting-hint">Перетащи окно на второй экран и нажми <kbd>F</kbd> для fullscreen. Клавиши <kbd>←</kbd>/<kbd>→</kbd> в любом окне листают блоки.</p>
      </section>

      <footer class="modal-footer">
        <button id="settings-reset" class="text-btn" type="button">Сбросить к пресету</button>
      </footer>
    </div>
  </div>

  <script src="data/songs.js"></script>
  <script src="app.js"></script>
</body>
</html>
