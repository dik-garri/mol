<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Материалы – Молодёжка</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply theme before first paint to avoid flash
    (function() {
      try {
        var saved = localStorage.getItem("materials-theme");
        var theme = saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        if (theme === "light") document.documentElement.setAttribute("data-theme", "light");
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" title="Переключить тему" aria-label="Переключить тему">
    <i class="fa-solid fa-sun icon-light"></i>
    <i class="fa-solid fa-moon icon-dark"></i>
  </button>
  <!-- LIST VIEW -->
  <div id="list-view" class="view">
    <div class="container">
      <a href="../" class="back-link"><i class="fa-solid fa-arrow-left"></i> На главную</a>
      <header>
        <h1>Материалы</h1>
        <p>Проповеди и разборы Евангелия от Луки</p>
      </header>

      <div class="tabs">
        <button class="tab" data-tab="sermons">Проповеди <span class="tab-count" id="count-sermons">0</span></button>
        <button class="tab" data-tab="luki">Луки <span class="tab-count" id="count-luki">0</span></button>
        <button class="tab" data-tab="draft">Драфт <span class="tab-count" id="count-draft">0</span></button>
      </div>

      <div class="search-row">
        <div class="search-wrap">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input id="search" type="search" placeholder="Поиск по теме или тегу..." autocomplete="off">
          <button id="clear-search" class="clear-btn" title="Очистить">&times;</button>
        </div>
      </div>

      <div id="active-tags" class="active-tags"></div>

      <ul id="materials-list" class="materials-list"></ul>
      <p id="empty-state" class="empty-state" hidden>Ничего не найдено</p>
    </div>
  </div>

  <!-- READER VIEW -->
  <div id="reader-view" class="view" hidden>
    <div class="container reader-container">
      <a href="#" class="back-link" id="back-to-list"><i class="fa-solid fa-arrow-left"></i> К списку</a>
      <div class="reader-meta">
        <p class="reader-date" id="reader-date"></p>
        <div id="reader-tags" class="reader-tags"></div>
      </div>
      <article id="reader-content" class="reader-content"></article>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
