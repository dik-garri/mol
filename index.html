<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Молодёжка</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Montserrat", Helvetica, sans-serif;
      background: #0F1B2D;
      color: #F0EBE0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 40px;
    }

    .container {
      max-width: 800px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 60px;
    }

    header .icon {
      font-size: 36px;
      color: #D4A843;
      margin-bottom: 15px;
    }

    header h1 {
      font-size: 52px;
      font-weight: 800;
      color: #D4A843;
      margin-bottom: 10px;
    }

    header p {
      font-size: 18px;
      color: #7A8BA8;
      font-weight: 300;
    }

    .hub-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 30px;
    }

    .hub-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid #2A3A52;
      border-radius: 16px;
      padding: 50px 36px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.3s, transform 0.2s, background 0.3s;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 18px;
    }

    .hub-card:hover {
      border-color: #D4A843;
      transform: translateY(-4px);
      background: rgba(212, 168, 67, 0.05);
    }

    .hub-card .card-icon {
      font-size: 48px;
      color: #D4A843;
    }

    .hub-card h2 {
      font-size: 26px;
      font-weight: 800;
      color: #F0EBE0;
    }

    .hub-card .card-subtitle {
      font-size: 15px;
      color: #7A8BA8;
      line-height: 1.5;
      font-weight: 300;
    }

    .hub-card .card-arrow {
      color: #D4A843;
      font-size: 14px;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      margin-top: 60px;
      color: #7A8BA8;
      font-size: 14px;
    }

    @media (max-width: 640px) {
      body { padding: 40px 20px; }
      header h1 { font-size: 40px; }
      .hub-cards {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      .hub-card { padding: 40px 28px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="icon"><i class="fa-solid fa-cross"></i></div>
      <h1>Молодёжка</h1>
      <p>Материалы для служения</p>
    </header>

    <div class="hub-cards">

      <a class="hub-card" href="presentations/">
        <div class="card-icon"><i class="fa-solid fa-people-group"></i></div>
        <h2>Молодёжка</h2>
        <p class="card-subtitle">Презентации для молодёжных групп</p>
        <span class="card-arrow">Открыть <i class="fa-solid fa-arrow-right"></i></span>
      </a>

      <a class="hub-card" href="https://dik-garri.github.io/uchenichestvo/">
        <div class="card-icon"><i class="fa-solid fa-book-bible"></i></div>
        <h2>Ученичество</h2>
        <p class="card-subtitle">Преображающее знакомство со Христом</p>
        <span class="card-arrow">Открыть <i class="fa-solid fa-arrow-right"></i></span>
      </a>

      <a class="hub-card" href="pesni/">
        <div class="card-icon"><i class="fa-solid fa-music"></i></div>
        <h2>Песни</h2>
        <p class="card-subtitle">Молодёжный сборник для проектора</p>
        <span class="card-arrow">Открыть <i class="fa-solid fa-arrow-right"></i></span>
      </a>

    </div>

    <footer>
      <i class="fa-solid fa-cross" style="margin-right: 5px;"></i> Молодёжка
    </footer>
  </div>
</body>
</html>
