<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ученичество</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&family=Lora:ital,wght@0,400;0,700;1,400&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Montserrat", sans-serif;
      background: #0F1B2D;
      color: #F0EBE0;
      line-height: 1.7;
      padding: 40px 20px;
    }

    .container { max-width: 800px; margin: 0 auto; }

    .back-link {
      display: inline-block;
      color: #7A8BA8;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 30px;
      transition: color 0.2s;
    }
    .back-link:hover { color: #D4A843; }

    #content h1 {
      font-size: 32px;
      font-weight: 800;
      color: #D4A843;
      margin-bottom: 10px;
    }

    #content h2 {
      font-size: 24px;
      font-weight: 700;
      color: #D4A843;
      margin-top: 40px;
      margin-bottom: 15px;
      padding-bottom: 8px;
      border-bottom: 1px solid #2A3A52;
    }

    #content h3 {
      font-size: 18px;
      font-weight: 700;
      color: #F0EBE0;
      margin-top: 25px;
      margin-bottom: 10px;
    }

    #content p {
      margin-bottom: 12px;
      color: #D0C9BC;
    }

    #content blockquote {
      font-family: "Lora", serif;
      font-style: italic;
      border-left: 3px solid #D4A843;
      padding: 12px 20px;
      margin: 15px 0;
      background: rgba(212, 168, 67, 0.05);
      color: #E8DFD0;
    }

    #content ul, #content ol {
      margin: 10px 0 15px 25px;
      color: #D0C9BC;
    }

    #content li { margin-bottom: 6px; }

    #content strong { color: #F0EBE0; }

    #content hr {
      border: none;
      border-top: 1px solid #2A3A52;
      margin: 30px 0;
    }

    #content table {
      width: 100%;
      border-collapse: collapse;
      margin: 15px 0;
    }

    #content th {
      background: rgba(212, 168, 67, 0.15);
      color: #D4A843;
      padding: 10px 15px;
      text-align: left;
      font-weight: 700;
      border: 1px solid #2A3A52;
    }

    #content td {
      padding: 8px 15px;
      border: 1px solid #2A3A52;
      color: #D0C9BC;
    }

    #content code {
      background: rgba(255,255,255,0.08);
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 0.9em;
    }

    .loading {
      text-align: center;
      color: #7A8BA8;
      padding: 60px 0;
      font-size: 18px;
    }

    .error {
      text-align: center;
      color: #C75B5B;
      padding: 60px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <a class="back-link" href="./"><i class="fas fa-arrow-left"></i> Все темы</a>
    <div id="content">
      <div class="loading">Загрузка...</div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const file = params.get('file');
    const contentEl = document.getElementById('content');

    if (!file) {
      contentEl.innerHTML = '<div class="error">Тема не указана</div>';
    } else {
      fetch(file)
        .then(r => {
          if (!r.ok) throw new Error('Not found');
          return r.text();
        })
        .then(md => {
          contentEl.innerHTML = marked.parse(md);
          // Update page title from first h1
          const h1 = contentEl.querySelector('h1');
          if (h1) document.title = h1.textContent + ' – Ученичество';
        })
        .catch(() => {
          contentEl.innerHTML = '<div class="error">Не удалось загрузить тему</div>';
        });
    }
  </script>
</body>
</html>
