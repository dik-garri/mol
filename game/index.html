<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Что выберешь ты?</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/black.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap">

<style>
  :root {
    --gold: #D4A843;
    --teal: #5B8CA8;
    --dark: #0F1B2D;
  }

  .reveal { font-family: "Montserrat", Helvetica, sans-serif; }

  /* Картиночные слайды: фон на весь экран, целиком виден (contain) */
  .reveal .slides section.pic {
    padding: 0;
  }

  /* Титульный слайд */
  .reveal .slides section.intro h1 {
    font-family: "Montserrat", sans-serif;
    font-weight: 800;
    color: var(--gold);
    font-size: 2.4em;
    text-transform: none;
    line-height: 1.1;
    margin-bottom: 0.3em;
  }
  .reveal .slides section.intro p {
    color: #cdd6e4;
    font-weight: 600;
    font-size: 1.1em;
  }
  .reveal .slides section.intro .num-hint {
    margin-top: 1.2em;
    color: var(--teal);
    font-size: 1.3em;
    letter-spacing: 0.15em;
    font-weight: 800;
  }

  .reveal .progress { color: var(--gold); }
</style>

<div class="reveal">
  <div class="slides">

    <!-- Титульный слайд -->
    <section class="intro" data-background-color="#0F1B2D">
      <h1>Что выбрал&nbsp;бы<br>он/она?</h1>
      <p class="num-hint">1 · 2 · 3 · 4</p>
    </section>

    <!-- ===== Раздел 1: Мужья выбирают для жён ===== -->
    <section class="intro" data-background-color="#0F1B2D">
      <h1>Мужья выбирают<br>для жён</h1>
    </section>

    <!-- Платья -->
    <section class="pic" data-background-color="#000"
      data-background-image="Gemini_Generated_Image_qb6epaqb6epaqb6e.png"
      data-background-size="contain"></section>

    <!-- Машины (8vh5qv) -->
    <section class="pic" data-background-color="#000"
      data-background-image="Gemini_Generated_Image_8vh5qv8vh5qv8vh5.png"
      data-background-size="contain"></section>

    <!-- Дома с садом -->
    <section class="pic" data-background-color="#000"
      data-background-image="Gemini_Generated_Image_838w2a838w2a838w.png"
      data-background-size="contain"></section>

    <!-- Кухня -->
    <section class="pic" data-background-color="#000"
      data-background-image="collage-kuhnya.png"
      data-background-size="contain"></section>

    <!-- Питомцы -->
    <section class="pic" data-background-color="#000"
      data-background-image="Gemini_Generated_Image_jy1f9djy1f9djy1f.png"
      data-background-size="contain"></section>

    <!-- Отдых -->
    <section class="pic" data-background-color="#000"
      data-background-image="collage-otdyh.png"
      data-background-size="contain"></section>

    <!-- Путешествие -->
    <section class="pic" data-background-color="#000"
      data-background-image="collage-otpusk.png"
      data-background-size="contain"></section>

    <!-- ===== Раздел 2: Жёны выбирают для мужей ===== -->
    <section class="intro" data-background-color="#0F1B2D">
      <h1>Жёны выбирают<br>для мужей</h1>
    </section>

    <!-- Машины (ywk776) -->
    <section class="pic" data-background-color="#000"
      data-background-image="Gemini_Generated_Image_ywk776ywk776ywk7.png"
      data-background-size="contain"></section>

    <!-- Дома с высоты -->
    <section class="pic" data-background-color="#000"
      data-background-image="Gemini_Generated_Image_hmj38ehmj38ehmj3.png"
      data-background-size="contain"></section>

    <!-- Животные -->
    <section class="pic" data-background-color="#000"
      data-background-image="Gemini_Generated_Image_gsfzikgsfzikgsfz.png"
      data-background-size="contain"></section>

    <!-- Еда -->
    <section class="pic" data-background-color="#000"
      data-background-image="Gemini_Generated_Image_i19npai19npai19n.png"
      data-background-size="contain"></section>

    <!-- Приключения -->
    <section class="pic" data-background-color="#000"
      data-background-image="Gemini_Generated_Image_hx664shx664shx66.png"
      data-background-size="contain"></section>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
<script>
  Reveal.initialize({
    hash: true,
    controls: true,
    progress: true,
    slideNumber: 'c/t',
    transition: 'slide',
    center: true,
    width: 1280,
    height: 720,
  });
</script>
